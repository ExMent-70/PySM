# ==============================================================================
# Конфигурационный файл для этапа кластеризации локаций
# ==============================================================================

[paths]
# Корневая папка с бинарными файлами и моделями
model_root = "../../../../_BIN"

# Путь к ONNX-модели CLIP (Vision Encoder). 
# Убедитесь, что файл ViT-L-14.onnx существует по этому пути относительно model_root.
clip_model_onnx = "models/CLIP/ViT-L-14.onnx"

# Путь к папке, где будет лежать (или куда скачается) токенизатор CLIP.
# Относительно model_root.
tokenizer_path = "models/tokenizer/clip-vit-large-patch14"

[provider]
# Провайдер ONNX Runtime: 'CUDAExecutionProvider', 'TensorrtExecutionProvider' или 'CPUExecutionProvider'
# Если оставить пустым (null), будет выбран автоматически.
provider_name = "CUDAExecutionProvider" 
device_id = 0
tensorRT_cache_path = "../../../../_BIN/TensorRT_cache"

[model_params]
# Размер входного изображения для модели CLIP (обычно 224x224 или 336x336 для L/14@336px)
input_size = [224, 224]

# Суффикс, который добавляется к имени оригинального файла при генерации маски.
# Используется для поиска оригинального фото по маске.
mask_suffix = "_BiRefNet-portrait_output.jpg"

[clustering]
# Параметры для алгоритма DBSCAN
min_samples = 2
metric = "cosine"
# Порог eps для косинусного расстояния. 
# Для CLIP эмбеддингов значения обычно лежат в диапазоне 0.05 - 0.20.
# Чем меньше значение, тем более строгая группировка (меньше ложных срабатываний, но больше дробления).
eps = 0.14

[classification]
# Порог уверенности (similarity score) для Zero-shot классификации по тексту.
match_threshold = 0.10